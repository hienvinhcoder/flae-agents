@if (show()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <!-- Backdrop -->
    <div 
      class="fixed inset-0 bg-app/80 backdrop-blur-md transition-opacity duration-300"
      (click)="onClose()"
    ></div>

    <!-- Modal Panel -->
    <div 
      class="relative w-full max-w-2xl bg-surface border border-border-strong rounded-2xl shadow-elevated p-6 overflow-hidden z-10 transition-all transform duration-300 scale-100 opacity-100 flex flex-col gap-4 max-h-[85vh]"
    >
      <!-- Header -->
      <div class="flex items-center justify-between">
        <h3 class="text-text-primary text-lg font-bold flex items-center gap-2">
          <lucide-icon name="pencil-line" class="w-5 h-5 text-primary"></lucide-icon>
          Nhập nội dung trực tiếp
        </h3>
        <button 
          (click)="onClose()" 
          class="p-1.5 rounded-lg text-text-disabled hover:text-text-primary hover:bg-white/5 transition duration-150 cursor-pointer"
        >
          <lucide-icon name="x" class="w-4 h-4"></lucide-icon>
        </button>
      </div>

      <!-- Error Message -->
      @if (errorMessage()) {
        <div class="flex items-start gap-2 bg-error/10 border border-error/20 text-error px-4 py-3 rounded-xl text-xs shrink-0">
          <lucide-icon name="circle-alert" class="w-4 h-4 shrink-0 mt-0.5"></lucide-icon>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <!-- Tab Switcher -->
      <div class="flex border-b border-border shrink-0">
        <button 
          (click)="setTab('edit')"
          [class.border-primary]="activeTab() === 'edit'"
          [class.text-primary]="activeTab() === 'edit'"
          [class.text-text-disabled]="activeTab() !== 'edit'"
          class="px-4 py-2 text-sm font-semibold border-b-2 border-transparent transition cursor-pointer hover:text-text-primary"
        >
          Soạn thảo
        </button>
        <button 
          (click)="setTab('preview')"
          [class.border-primary]="activeTab() === 'preview'"
          [class.text-primary]="activeTab() === 'preview'"
          [class.text-text-disabled]="activeTab() !== 'preview'"
          class="px-4 py-2 text-sm font-semibold border-b-2 border-transparent transition cursor-pointer hover:text-text-primary"
        >
          Xem trước (Preview)
        </button>
      </div>

      <!-- Tab Contents (Scrollable Area) -->
      <div class="flex-1 overflow-y-auto min-h-60 pr-1">
        @if (activeTab() === 'edit') {
          <!-- Edit Form -->
          <div class="space-y-4">
            <!-- Title -->
            <div class="space-y-1.5">
              <label class="text-xs font-semibold text-text-primary uppercase tracking-wide">
                Tiêu đề tài liệu <span class="text-error">*</span>
              </label>
              <input 
                type="text" 
                [ngModel]="title()"
                (ngModelChange)="title.set($event)"
                [disabled]="saving()"
                placeholder="Nhập tiêu đề tài liệu (ví dụ: Tài liệu hướng dẫn khách hàng)..."
                class="w-full rounded-xl border border-border bg-app px-3.5 py-2.5 text-sm text-text-primary placeholder:text-text-disabled outline-none transition focus:border-ai focus:ring-2 focus:ring-ai/30 disabled:opacity-50"
              />
            </div>

            <!-- Description -->
            <div class="space-y-1.5">
              <label class="text-xs font-semibold text-text-primary uppercase tracking-wide">Mô tả ngắn</label>
              <input 
                type="text" 
                [ngModel]="description()"
                (ngModelChange)="description.set($event)"
                [disabled]="saving()"
                placeholder="Mô tả tóm tắt ngắn về tài liệu này (tùy chọn)..."
                class="w-full rounded-xl border border-border bg-app px-3.5 py-2.5 text-sm text-text-primary placeholder:text-text-disabled outline-none transition focus:border-ai focus:ring-2 focus:ring-ai/30 disabled:opacity-50"
              />
            </div>

            <!-- Content Area -->
            <div class="space-y-1.5 flex flex-col">
              <label class="text-xs font-semibold text-text-primary uppercase tracking-wide">
                Nội dung chi tiết <span class="text-error">*</span>
              </label>
              <textarea 
                [ngModel]="contentText()"
                (ngModelChange)="contentText.set($event)"
                [disabled]="saving()"
                placeholder="Nhập nội dung tài liệu bằng văn bản thô hoặc định dạng Markdown (# Tiêu đề, **In đậm**, *In nghiêng*, - Danh sách...)"
                class="min-h-56 w-full rounded-xl border border-border bg-app px-3.5 py-2.5 text-sm font-mono leading-relaxed text-text-primary placeholder:text-text-disabled outline-none transition focus:border-ai focus:ring-2 focus:ring-ai/30 disabled:opacity-50 flex-1 resize-y"
              ></textarea>
            </div>
          </div>
        } @else {
          <!-- Preview Box -->
          <div class="bg-app/60 border border-border rounded-xl p-5 min-h-[340px] prose prose-invert max-w-none">
            <div class="space-y-2 mb-5 pb-4 border-b border-border">
              <h2 class="text-text-primary font-bold text-xl leading-snug">
                {{ title() || 'Chưa nhập tiêu đề' }}
              </h2>
              @if (description()) {
                <p class="text-text-muted text-xs italic font-sans">{{ description() }}</p>
              }
            </div>
            <!-- Dynamic InnerHTML -->
            <div [innerHTML]="renderedPreview()" class="markdown-body font-sans text-text-secondary"></div>
          </div>
        }
      </div>

      <!-- Footer Buttons -->
      <div class="flex items-center justify-end gap-2.5 border-t border-border pt-4 shrink-0">
        <app-button 
          variant="secondary" 
          (btnClick)="onClose()" 
          [disabled]="saving()"
          class="w-auto"
        >
          {{ 'COMMON.CANCEL' | translate }}
        </app-button>
        <app-button 
          variant="primary" 
          (btnClick)="onSubmit()" 
          [loading]="saving()"
          [disabled]="!title().trim() || !contentText().trim() || saving()"
          class="w-auto"
        >
          {{ 'COMMON.SAVE' | translate }}
        </app-button>
      </div>
    </div>
  </div>
}
