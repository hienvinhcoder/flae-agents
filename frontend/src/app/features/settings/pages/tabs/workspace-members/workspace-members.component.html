<div class="space-y-8">
  <!-- Section Title & Action Button -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h3 class="text-xl font-bold tracking-tight text-text-primary">Quản Lý Thành Viên & Phân Quyền</h3>
      <p class="text-xs text-text-muted mt-1">Mời thành viên mới vào workspace và quản lý quyền truy cập hệ thống.</p>
    </div>

    @if (currentUserRole() === 'owner' || currentUserRole() === 'admin') {
      <app-button
        type="button"
        variant="primary"
        rounded="xl"
        (btnClick)="openInviteModal()"
        class="w-full sm:w-auto shrink-0 group"
      >
        <div class="flex items-center gap-2 justify-center">
          <lucide-icon name="user-plus" class="w-4 h-4 transition-transform duration-300 group-hover:rotate-12"></lucide-icon>
          <span>Mời Thành Viên</span>
        </div>
      </app-button>
    }
  </div>

  <!-- Member List Component -->
  <app-member-list
    [members]="members()"
    [currentUserRole]="currentUserRole()"
    [currentUserUid]="currentUserUid()"
    (roleChanged)="onRoleChanged($event)"
    (statusChanged)="onStatusChanged($event)"
    (memberRemoved)="onMemberRemoved($event)"
  ></app-member-list>

  <!-- Invitation List Component -->
  <app-invitation-list
    [invitations]="invitations()"
    [currentUserRole]="currentUserRole()"
    (invitationRevoked)="onInvitationRevoked($event)"
    class="block mt-8"
  ></app-invitation-list>

  <!-- Invite Popup Modal -->
  <app-invite-modal
    [isOpen]="isInviteModalOpen()"
    [isSubmitting]="isInviting()"
    (close)="closeInviteModal()"
    (invited)="onInvited($event)"
  ></app-invite-modal>
</div>
