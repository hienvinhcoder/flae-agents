[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "cryptography>=47.0.0",
    "fastapi>=0.136.1",
    "firebase-admin>=7.4.0",
    "google-cloud-storage>=2.18.0",
    "google-genai>=1.0.0",
    "httpx>=0.28.1",
    "langchain>=1.3.4",
    "langchain-core>=1.4.1",
    "langchain-google-genai>=4.2.5",
    "langgraph>=1.2.4",
    "langsmith>=0.8.9",
    "lingua-language-detector>=2.1.1",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.0",
    "pydantic[email]>=2.13.3",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.3",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.30",
    "temporalio>=1.27.2",
    "tenacity>=9.1.4",
    "tiktoken>=0.7.0",
    "uvicorn>=0.46.0",
    "websockets>=12.0",
    "watchfiles>=0.21.0",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary,pool]>=3.3.4",
]

[project.scripts]
migrate = "scripts.migrate:run_migrations"
flae-worker = "workers.flae_worker:main"

[tool.uv]
package = true
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.0.0",
    "types-psycopg2>=2.9.21.20260518",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts", "migrations", "workers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
