name: CI/CD Test Suite

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flae_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv (Package Manager)
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install Backend Dependencies
      run: |
        cd backend
        uv sync --frozen

    - name: Run Backend Tests
      env:
        ENVIRONMENT: testing
        POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/flae_db
        RAG_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/rag_db
        REDIS_URL: redis://localhost:6379/1
      run: |
        cd backend
        uv run pytest --cov=app tests/

  frontend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.19.0'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: npm ci

    - name: Check Frontend File Size
      run: npm run check:file-size

    - name: Typecheck Frontend
      run: npm run typecheck

    - name: Lint Frontend
      run: npm run lint

    - name: Test Frontend With Coverage
      run: npm run test:coverage

    - name: Build Frontend
      env:
        VITE_API_URL: http://127.0.0.1:8000/api/v1
        VITE_FIREBASE_API_KEY: ci-placeholder
        VITE_FIREBASE_APP_ID: 1:123456789:web:ci
        VITE_FIREBASE_AUTH_DOMAIN: ci.invalid
        VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789'
        VITE_FIREBASE_PROJECT_ID: flae-ci
        VITE_FIREBASE_STORAGE_BUCKET: flae-ci.invalid
        VITE_WS_URL: ws://127.0.0.1:8000
      run: npm run build

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    - name: Run Frontend E2E Tests
      run: npm run test:e2e
