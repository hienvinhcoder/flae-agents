version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flae_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/flae_db
      - REDIS_URL=redis://redis:6379/0
      - TEMPORAL_HOST=temporal:7233
      - UV_LINK_MODE=copy
    volumes:
      - ./backend:/app
      - /app/.venv # Tránh mount đè thư mục virtual environment của uv
    depends_on:
      - postgres
      - redis
      - temporal
    networks:
      - app-network


  temporal:
    image: temporalio/auto-setup:1.24.2
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=postgres
      - LOG_LEVEL=error
    depends_on:
      - postgres
    networks:
      - app-network

  temporal-ui:
    image: temporalio/ui:2.24.0
    ports:
      - "8233:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal
    networks:
      - app-network

  flae-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uv run flae-worker
    environment:
      - POSTGRES_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/flae_db
      - REDIS_URL=redis://redis:6379/0
      - TEMPORAL_HOST=temporal:7233
      - ENVIRONMENT=local
      - UV_LINK_MODE=copy
    volumes:
      - ./backend:/app
      - /app/.venv # Tránh mount đè thư mục virtual environment của uv
    depends_on:
      - postgres
      - redis
      - temporal
    networks:
      - app-network



networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
